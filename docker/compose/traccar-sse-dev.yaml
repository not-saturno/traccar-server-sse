# traccar-server-sse in development mode. See docs/desenvolvimento.md.
#
#   docker compose -f docker/compose/traccar-sse-dev.yaml up --build
#
# - front:   Vite with hot reload on http://localhost:5173 (edits in traccar-web/ apply immediately)
# - traccar: backend built from the current source; after Java changes run
#            docker compose -f docker/compose/traccar-sse-dev.yaml up --build traccar
# - JDWP debugger on localhost:5005 (attach from the IDE)
#
# Host ports can be changed with TRACCAR_PORT, OSMAND_PORT, WATCH_PORT, DEBUG_PORT and FRONT_PORT (environment or
# docker/compose/.env), for example when a local Traccar already uses 8082.
#
# Optional Cloudflare Tunnel (profile "tunnel") to open the dev front on a public hostname, see docs/cloudflare.md:
#   TUNNEL_TOKEN=... VITE_ALLOWED_HOSTS=dev-onibus.example.com \
#     docker compose -f docker/compose/traccar-sse-dev.yaml --profile tunnel up --build
# In the dashboard, point the hostname to http://front:5173 (or the FRONT_PORT in use).

name: traccar-sse-dev

services:

  traccar:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.sse
      args:
        EXTRA_MODULES: ",jdk.jdwp.agent" # debugger support in the jlink runtime
    image: traccar-sse:dev
    ports:
      - "127.0.0.1:${TRACCAR_PORT:-8082}:8082"
      - "${OSMAND_PORT:-5055}:5055"
      - "${WATCH_PORT:-5093}:5093"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"
    command:
      - "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      - "-jar"
      - "tracker-server.jar"
      - "conf/traccar.xml"
    volumes:
      - ./traccar-sse-dev.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-dev-data:/opt/traccar/data

  front:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - traccar
    ports:
      # Same port inside and outside: the Vite HMR client connects back to the dev server port
      - "127.0.0.1:${FRONT_PORT:-5173}:${FRONT_PORT:-5173}"
    environment:
      FRONT_PORT: ${FRONT_PORT:-5173}
      VITE_PROXY_TARGET: http://traccar:8082
      # Set to true if edits are not picked up (some Docker Desktop / WSL bind mounts miss file events)
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      # Extra hosts accepted by Vite, e.g. the tunnel hostname (otherwise Vite answers "Blocked request")
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    # npm ci only when package-lock.json changed since the last install in the node_modules volume
    command:
      - sh
      - -c
      - >-
        (cmp -s package-lock.json node_modules/.installed-lock || (npm ci && cp package-lock.json node_modules/.installed-lock))
        && exec npx vite --host 0.0.0.0 --port "$$FRONT_PORT" --strictPort
    volumes:
      - ../../traccar-web:/app
      # node_modules stays inside the container (Linux build of the dependencies, host copy untouched)
      - front-node-modules:/app/node_modules

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    depends_on:
      - front
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Not "?" required: compose interpolates the whole file even when the profile is off
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  traccar-dev-data:
  front-node-modules:
