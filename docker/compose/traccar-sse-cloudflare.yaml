# traccar-server-sse in production behind a Cloudflare Tunnel. See docs/cloudflare.md.
#
#   docker compose -f docker/compose/traccar-sse-cloudflare.yaml up -d --build
#
# TUNNEL_TOKEN comes from the Cloudflare dashboard (Zero Trust > Networks > Tunnels) and is read from the
# environment or from docker/compose/.env. Public hostnames are set in the dashboard:
#   onibus.example.com -> http://traccar:8082   (front, API, SSE, WebSocket)
#   gps.example.com    -> http://traccar:5055   (optional: OsmAnd trackers over HTTPS)
#
# The web port is not published: Cloudflare reaches it only through the tunnel, so the real client IP header
# (CF-Connecting-IP) cannot be forged by connecting to Traccar directly.
# The Watch protocol (GPS trackers) is raw TCP and cannot use the tunnel: port 5093 is published and the trackers
# connect to the server public IP (DNS record "DNS only", not proxied). See docs/cloudflare.md.
# Uses the same project name and volumes as traccar-sse.yaml / traccar-sse-caddy.yaml, so the database carries over.

name: traccar-sse

services:

  traccar:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.sse
    image: traccar-sse:latest
    restart: unless-stopped
    ports:
      # Watch protocol: raw TCP straight from the trackers (open it in the server firewall)
      - "5093:5093"
      # Uncomment only for OsmAnd trackers that cannot use HTTPS and must reach the server directly
      # - "5055:5055"
    volumes:
      - ./traccar-sse.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - traccar
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN from Cloudflare Zero Trust > Networks > Tunnels}

volumes:
  traccar-data:
  traccar-logs:
