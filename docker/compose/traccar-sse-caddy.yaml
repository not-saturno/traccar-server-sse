# traccar-server-sse in production behind Caddy, with automatic HTTPS. See docs/deploy.md.
#
#   docker compose -f docker/compose/traccar-sse-caddy.yaml up -d --build
#
# SERVER_NAME and ACME_EMAIL are read from the environment or from docker/compose/.env.
# Uses the same project name and volumes as traccar-sse.yaml (nginx), so the database carries over.

name: traccar-sse

services:

  traccar:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.sse
    image: traccar-sse:latest
    restart: unless-stopped
    ports:
      # OsmAnd straight to the server. Remove it if trackers send through HTTPS (see docs/osmand-security.md).
      - "5055:5055"
      # Watch protocol (GPS trackers): raw TCP, always straight to the server (see docs/cloudflare.md)
      - "5093:5093"
    volumes:
      - ./traccar-sse.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - traccar
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME to the public domain}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate expiry notices}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account. Keep this volume, or every restart asks for a new certificate.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  traccar-data:
  traccar-logs:
  caddy-data:
  caddy-config:
